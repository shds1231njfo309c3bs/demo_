<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" aria-labelledby="title desc" role="img">
  <title id="title">Bubble Sort Visualization</title>
  <desc id="desc">Static preview of Grok bubble sort visualization.</desc>
  
  <!-- Background -->
  <rect width="900" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="45" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a365d">Bubble Sort Visualization</text>
  <text x="450" y="70" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#4a5568">Array: [45, 32, 67, 12, 89, 23, 55, 78]</text>
  
  <!-- Legend -->
  <rect x="30" y="85" width="220" height="110" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="45" y="105" font-family="Arial" font-size="13" font-weight="bold" fill="#1a365d">Legend</text>
  <rect x="45" y="115" width="18" height="18" fill="#3b82f6" stroke="#1e40af"/>
  <text x="70" y="128" font-family="Arial" font-size="12" fill="#334155">Default / Comparing</text>
  <rect x="45" y="140" width="18" height="18" fill="#22c55e" stroke="#166534"/>
  <text x="70" y="153" font-family="Arial" font-size="12" fill="#334155">Sorted</text>
  <circle cx="54" cy="175" r="6" fill="#f59e0b"/>
  <text x="70" y="178" font-family="Arial" font-size="12" fill="#334155">Comparing (pulse)</text>
  
  <!-- Progress label and bar container -->
  <text x="670" y="105" font-family="Arial" font-size="13" font-weight="bold" fill="#1a365d">Pass Progress</text>
  <rect x="670" y="115" width="200" height="12" rx="6" fill="#e2e8f0"/>
  <rect id="progressBar" x="670" y="115" width="28" height="12" rx="6" fill="#3b82f6">
  </rect>
  <text id="passText" x="770" y="142" font-family="Arial" font-size="13" text-anchor="middle" fill="#334155">Pass 1/7</text>
  
  <!-- Array bars and initial values (positions tuned for 8 bars) -->
  <!-- Bar 0: 45 @ x=80 -->
  <rect id="bar0" x="80" y="320" width="45" height="180" fill="#3b82f6" stroke="#1e40af" stroke-width="3" rx="4"/>
  <text id="val0" x="102.5" y="515" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e2937">45</text>
  
  <!-- Bar 1: 32 @ x=145 -->
  <rect id="bar1" x="145" y="365" width="45" height="135" fill="#3b82f6" stroke="#1e40af" stroke-width="3" rx="4"/>
  <text id="val1" x="167.5" y="515" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e2937">32</text>
  
  <!-- Bar 2: 67 @ x=210 -->
  <rect id="bar2" x="210" y="265" width="45" height="235" fill="#3b82f6" stroke="#1e40af" stroke-width="3" rx="4"/>
  <text id="val2" x="232.5" y="515" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e2937">67</text>
  
  <!-- Bar 3: 12 @ x=275 -->
  <rect id="bar3" x="275" y="440" width="45" height="60" fill="#3b82f6" stroke="#1e40af" stroke-width="3" rx="4"/>
  <text id="val3" x="297.5" y="515" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e2937">12</text>
  
  <!-- Bar 4: 89 @ x=340 -->
  <rect id="bar4" x="340" y="190" width="45" height="310" fill="#3b82f6" stroke="#1e40af" stroke-width="3" rx="4"/>
  <text id="val4" x="362.5" y="515" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e2937">89</text>
  
  <!-- Bar 5: 23 @ x=405 -->
  <rect id="bar5" x="405" y="400" width="45" height="100" fill="#3b82f6" stroke="#1e40af" stroke-width="3" rx="4"/>
  <text id="val5" x="427.5" y="515" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e2937">23</text>
  
  <!-- Bar 6: 55 @ x=470 -->
  <rect id="bar6" x="470" y="300" width="45" height="200" fill="#3b82f6" stroke="#1e40af" stroke-width="3" rx="4"/>
  <text id="val6" x="492.5" y="515" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e2937">55</text>
  
  <!-- Bar 7: 78 @ x=535 -->
  <rect id="bar7" x="535" y="240" width="45" height="260" fill="#3b82f6" stroke="#1e40af" stroke-width="3" rx="4"/>
  <text id="val7" x="557.5" y="515" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e2937">78</text>
  
  <!-- Base line -->
  <line x1="60" y1="520" x2="610" y2="520" stroke="#64748b" stroke-width="4"/>
  
  <!-- Phase / status text (centered below bars) -->
  <text id="phaseText" x="335" y="560" font-family="Arial" font-size="16" font-weight="600" text-anchor="middle" fill="#334155">Starting bubble sort...</text>
  
  <!-- Right side: Pseudocode -->
  <rect x="670" y="170" width="210" height="260" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="700" y="190" font-family="Arial" font-size="14" font-weight="bold" fill="#1e40af">Pseudocode</text>
  
  <text id="code0" x="685" y="215" font-family="monospace" font-size="11.5" fill="#475569">for pass = 0 to n-2:</text>
  <text id="code1" x="685" y="235" font-family="monospace" font-size="11.5" fill="#475569">  for j = 0 to n-pass-2:</text>
  <text id="code2" x="700" y="255" font-family="monospace" font-size="11.5" fill="#475569">    if arr[j] > arr[j+1]:</text>
  <text id="code3" x="715" y="275" font-family="monospace" font-size="11.5" fill="#475569">      swap(arr[j], arr[j+1])</text>
  <text id="code4" x="685" y="300" font-family="monospace" font-size="11.5" fill="#475569">Optimized early stop if no swaps</text>
  
  <!-- Highlight box for current pseudocode line (starts hidden) -->
  <rect id="highlight" x="680" y="205" width="195" height="17" fill="#fef3c7" opacity="0" stroke="#f59e0b" stroke-width="2" rx="2">
  </rect>
  
  <!-- Final sorted indicator (hidden until end) -->
  <rect x="670" y="460" width="210" height="55" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="3" opacity="0">
  </rect>
  <text x="775" y="480" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#10b981" opacity="0">
    ARRAY SORTED!
  </text>
  <text x="775" y="500" font-family="monospace" font-size="13" text-anchor="middle" fill="#166534" opacity="0">
    [12, 23, 32, 45, 55, 67, 78, 89]
  </text>
</svg>
