<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Definitions for gradients and markers -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGradient)" />
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#1a1a2e">Fourier Transform Visual Explanation</text>
  
  <!-- ========== PANEL 1: Time Domain Signal ========== -->
  <rect x="20" y="55" width="760" height="140" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="30" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#333">1. Time Domain: Sum of Sine Waves</text>
  
  <!-- Axis lines -->
  <line x1="80" y1="170" x2="720" y2="170" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="100" y1="180" x2="100" y2="85" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="730" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#666">time →</text>
  <text x="90" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#666">Amplitude</text>
  
  <!-- Complex waveform (sum of harmonics, approximating square wave) -->
  <path d="M 100,125 
           Q 140,85 180,125 Q 220,165 260,125 Q 300,85 340,125 Q 380,165 420,125 
           Q 460,85 500,125 Q 540,165 580,125 Q 620,85 660,125 Q 700,165 740,125" 
        fill="none" stroke="#1a1a2e" stroke-width="3" />
  
  <text x="400" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#555">Composite Signal = sin(ωt) + sin(3ωt)/3 + sin(5ωt)/5 + sin(7ωt)/7 ...</text>
  
  <!-- ========== PANEL 2: Constituent Frequencies ========== -->
  <rect x="20" y="205" width="760" height="260" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="30" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#333">2. Constituent Sine Waves (Building Blocks)</text>
  
  <!-- 1st Harmonic (Fundamental) -->
  <text x="30" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#2e7d32">1st harmonic (fundamental): sin(ωt)</text>
  <line x1="80" y1="270" x2="720" y2="270" stroke="#ddd" stroke-width="1" />
  <path d="M 100,270 
           C 150,220 200,220 250,270 
           C 300,320 350,320 400,270
           C 450,220 500,220 550,270
           C 600,320 650,320 700,270" 
        fill="none" stroke="#4caf50" stroke-width="2" />
  
  <!-- 3rd Harmonic -->
  <text x="30" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1565c0">3rd harmonic (÷3 amplitude): sin(3ωt)/3</text>
  <line x1="80" y1="320" x2="720" y2="320" stroke="#ddd" stroke-width="1" />
  <path d="M 100,320 
           C 117,300 133,300 150,320 
           C 167,340 183,340 200,320
           C 217,300 233,300 250,320
           C 267,340 283,340 300,320
           C 317,300 333,300 350,320
           C 367,340 383,340 400,320
           C 417,300 433,300 450,320
           C 467,340 483,340 500,320
           C 517,300 533,300 550,320
           C 567,340 583,340 600,320
           C 617,300 633,300 650,320
           C 667,340 683,340 700,320" 
        fill="none" stroke="#2196f3" stroke-width="2" />
  
  <!-- 5th Harmonic -->
  <text x="30" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#e65100">5th harmonic (÷5 amplitude): sin(5ωt)/5</text>
  <line x1="80" y1="370" x2="720" y2="370" stroke="#ddd" stroke-width="1" />
  <path d="M 100,370 L 120,365 L 140,380 L 160,365 L 180,380 L 200,365 
           L 220,380 L 240,365 L 260,380 L 280,365 L 300,380 L 320,365
           L 340,380 L 360,365 L 380,380 L 400,365 L 420,380 L 440,365
           L 460,380 L 480,365 L 500,380 L 520,365 L 540,380 L 560,365
           L 580,380 L 600,365 L 620,380 L 640,365 L 660,380 L 680,365 L 700,380" 
        fill="none" stroke="#ff9800" stroke-width="1.5" />
  
  <!-- 7th Harmonic -->
  <text x="30" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6a1b9a">7th harmonic (÷7 amplitude): sin(7ωt)/7</text>
  <line x1="80" y1="420" x2="720" y2="420" stroke="#ddd" stroke-width="1" />
  <path d="M 100,420 L 114,415 L 129,428 L 143,415 L 157,428 L 171,415
           L 186,428 L 200,415 L 214,428 L 229,415 L 243,428 L 257,415
           L 271,428 L 286,415 L 300,428 L 314,415 L 329,428 L 343,415
           L 357,428 L 371,415 L 386,428 L 400,415 L 414,428 L 429,415
           L 443,428 L 457,415 L 471,428 L 486,415 L 500,428 L 514,415
           L 529,428 L 543,415 L 557,428 L 571,415 L 586,428 L 600,415
           L 614,428 L 629,415 L 643,428 L 657,415 L 671,428 L 686,415 L 700,428" 
        fill="none" stroke="#9c27b0" stroke-width="1" />

  <!-- Mathematical note -->
  <text x="400" y="455" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#777" font-style="italic">Each harmonic has frequency n×ω and amplitude 1/n → creates "square approximation"</text>

  <!-- ========== PANEL 3: Frequency Domain ========== -->
  <rect x="20" y="475" width="760" height="115" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="30" y="495" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#333">3. Frequency Domain: The Fourier Transform Result</text>
  
  <!-- Axis -->
  <line x1="80" y1="555" x2="720" y2="555" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="100" y1="575" x2="100" y2="515" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="730" y="560" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#666">frequency →</text>
  <text x="90" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#666">Amplitude</text>
  
  <!-- Frequency spectrum bars -->
  <!-- ω -->
  <rect x="175" y="515" width="30" height="40" fill="#4caf50" opacity="0.8" />
  <text x="190" y="570" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4caf50">ω</text>
  <text x="190" y="510" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#333">1.0</text>
  
  <!-- 3ω -->
  <rect x="300" y="535" width="30" height="20" fill="#2196f3" opacity="0.8" />  
  <text x="315" y="570" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#2196f3">3ω</text>
  <text x="315" y="530" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#333">0.33</text>
  
  <!-- 5ω -->
  <rect x="425" y="543" width="30" height="12" fill="#ff9800" opacity="0.8" />
  <text x="440" y="570" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#e65100">5ω</text>
  <text x="440" y="538" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#333">0.20</text>
  
  <!-- 7ω -->
  <rect x="550" y="548" width="30" height="7" fill="#9c27b0" opacity="0.8" />
  <text x="565" y="570" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6a1b9a">7ω</text>
  <text x="565" y="543" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#333">0.14</text>
  
  <!-- Explanation arrow -->
  <path d="M 240,90 L 260,180" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)" />
  <path d="M 320,190 L 340,490" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)" />
  
  <text x="750" y="500" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#666" font-style="italic">Fourier Transform ↔</text>

</svg>
